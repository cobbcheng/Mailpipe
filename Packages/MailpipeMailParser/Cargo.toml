[package]
name = "mailpipe-mail-parser"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "mailpipe_mail_parser"
crate-type = ["staticlib", "rlib"]

[dependencies]
encoding_rs = "0.8"
html5gum = "0.9"
mail-parser = { version = "0.11", features = ["full_encoding"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
codegen-units = 1
strip = "none"
