name: Validate
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  app:
    # Swift 6.3.3 in Xcode 26.6 crashes emitting optimized MailKit extension IR.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: ./scripts/test.sh
      - name: Build both architectures without signing or installing
        run: |
          xcodebuild -project Mailpipe.xcodeproj -scheme Mailpipe -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/pr-xcode" \
            -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO \
            'ARCHS=arm64 x86_64' MARKETING_VERSION=0.2.1 CURRENT_PROJECT_VERSION=51 build
          python3 scripts/ci/check-bundle.py "$RUNNER_TEMP/pr-xcode/Build/Products/Release/Mailpipe.app" 0.2.1 51
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test website/*.test.mjs
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - run: bash -n scripts/ci/sign-release.sh
